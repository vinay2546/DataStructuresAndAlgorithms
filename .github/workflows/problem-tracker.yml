name: Update Hierarchical Problem Progress Trackers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: problem-progress-tracker
  cancel-in-progress: false

jobs:
  update-trackers:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate recursive trackers at every hierarchy level
        run: python3 .github/scripts/update_problem_tracker.py

      - name: Create or update tracker pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/generated-problem-trackers
          delete-branch: true
          commit-message: "docs: update hierarchical problem progress trackers"
          title: "docs: update hierarchical problem progress trackers"
          body: |
            Automated update of repository-wide hierarchical LeetCode progress trackers.

            This pull request was generated after scanning all matching problem folders and rolling their statuses up through every ancestor directory.
