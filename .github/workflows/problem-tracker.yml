name: Update Problem Progress Tracker

on:
  push:
    branches:
      - main
    paths:
      - "src/main/java/**"
      - ".github/workflows/problem-tracker.yml"
      - ".github/scripts/update_problem_tracker.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: problem-progress-tracker
  cancel-in-progress: false

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tracker from problem READMEs
        env:
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/update_problem_tracker.py

      - name: Commit tracker update
        run: |
          if git diff --quiet -- README.md; then
            echo "Problem tracker is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update problem progress tracker"
          git push
