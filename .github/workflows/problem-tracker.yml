name: Manually Standardize Problem READMEs and Update Trackers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: problem-readme-standardization
  cancel-in-progress: false

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.ref }}
          token: \${{ secrets.TRACKER_PUSH_TOKEN }}
          fetch-depth: 0

      - name: Standardize problem READMEs and generate progress trackers
        run: python3 .github/scripts/update_problem_tracker.py

      - name: Commit and push README updates
        env:
          TARGET_BRANCH: \${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "All problem READMEs and progress trackers already follow the standard."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md '**/README.md'
          git commit -m "docs: standardize problem README structure"
          git push origin "HEAD:\${TARGET_BRANCH}"
