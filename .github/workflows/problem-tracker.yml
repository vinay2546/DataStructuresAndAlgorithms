name: Update Hierarchical Problem Progress Trackers

on:
  push:
    branches:
      - main
    paths:
      - "src/main/java/**"
      - ".github/workflows/problem-tracker.yml"
      - ".github/scripts/update_problem_tracker.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: problem-progress-tracker
  cancel-in-progress: false

jobs:
  update-trackers:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate all tracker levels
        env:
          BASE_SHA: \${{ github.event.before || '' }}
          HEAD_SHA: \${{ github.sha }}
        run: python3 .github/scripts/update_problem_tracker.py

      - name: Commit tracker updates
        run: |
          if git diff --quiet; then
            echo "All progress trackers are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/main/java
          git commit -m "docs: update hierarchical problem progress trackers"
          git push
