name: Normalize numeric Java packages
on:
  push:
    branches:
      - refactor/alphabetize-numeric-packages-v3
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize package declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def alpha(n):
              s = ""
              while n >= 0:
                  s = chr(65 + n % 26) + s
                  n = n // 26 - 1
              return s
          pat = re.compile(r'(?<![A-Za-z0-9_$])([0-9]+)_')
          changed = 0
          for path in Path("src/main/java").rglob("*.java"):
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              idx = next((i for i,line in enumerate(lines) if line.strip().startswith("package ")), None)
              if idx is None: continue
              old = lines[idx]
              new = pat.sub(lambda m: alpha(int(m.group(1))-1) + "_", old)
              if new != old:
                  lines[idx] = new
                  path.write_text("".join(lines), encoding="utf-8")
                  changed += 1
          print(f"Changed {changed} package declarations.")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No package changes required."
          else
            git commit -m "refactor: replace numeric package prefixes with alphabetic prefixes"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Remove migration workflow
        run: |
          git rm .github/workflows/normalize-numeric-packages-v3.yml || true
          git commit -m "chore: remove one-time package normalization workflow" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

