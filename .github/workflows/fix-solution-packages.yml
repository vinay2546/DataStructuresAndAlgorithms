name: Fix Solution.java package declarations

on:
  push:
    branches:
      - fix/solution-package-declarations

permissions:
  contents: write

jobs:
  fix-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Align package declarations with directory paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_root = Path("src/main/java")
          package_pattern = re.compile(r"(?m)^package\\s+[^;]+;")
          changed = 0
          checked = 0

          for solution in source_root.rglob("Solution.java"):
              checked += 1
              expected = "package " + ".".join(solution.parent.relative_to(source_root).parts) + ";"
              original = solution.read_text(encoding="utf-8")
              if package_pattern.search(original):
                  updated = package_pattern.sub(expected, original, count=1)
              else:
                  updated = expected + "\\n\\n" + original
              if updated != original:
                  solution.write_text(updated, encoding="utf-8")
                  changed += 1

          mismatches = []
          for solution in source_root.rglob("Solution.java"):
              expected = "package " + ".".join(solution.parent.relative_to(source_root).parts) + ";"
              actual_match = package_pattern.search(solution.read_text(encoding="utf-8"))
              actual = actual_match.group(0) if actual_match else None
              if actual != expected:
                  mismatches.append((str(solution), actual, expected))

          print(f"Checked {checked} Solution.java files; corrected {changed}.")
          if mismatches:
              for mismatch in mismatches[:20]:
                  print("MISMATCH:", mismatch)
              raise SystemExit(f"Verification failed: {len(mismatches)} mismatches remain.")
          print("Verification passed: every Solution.java package matches its directory.")
          PY

      - name: Commit corrections and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-solution-packages.yml
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No package corrections were necessary."
            exit 0
          fi
          git commit -m "Fix Solution.java package declarations"
          git push origin HEAD
