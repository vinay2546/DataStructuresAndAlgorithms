name: Correct Tree package serialization

on:
  pull_request:
    types: [synchronize]

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'refactor/alphabetize-numeric-packages-v3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/alphabetize-numeric-packages-v3
          fetch-depth: 0
      - name: Rename Tree BFS and DFS folders and packages
        shell: bash
        run: |
          set -euo pipefail
          alpha() {
            local n=$1 result=''
            while (( n > 0 )); do
              n=$((n-1))
              result="$(printf "\\$(printf '%03o' $((65+n%26)))")${result}"
              n=$((n/26))
            done
            printf '%s' "$result"
          }
          changed=0
          while IFS= read -r dir; do
            base="$(basename "$dir")"
            parent="$(dirname "$dir")"
            if [[ "$base" =~ ^([A-Z]+)_(.*)$ ]]; then
              prefix="${BASH_REMATCH[1]}"
              suffix="${BASH_REMATCH[2]}"
              n=0
              for ((i=0;i<${#prefix};i++)); do
                n=$((n*26 + $(printf '%d' "'${prefix:i:1}") - 64))
              done
              target="${parent}/$(alpha $((n+26)))_${suffix}"
              if [[ ! -e "$target" ]]; then
                git mv "$dir" "$target"
                changed=$((changed+1))
              fi
            fi
          done < <(find src/main/java/Tree/B_Traversal/BFS src/main/java/Tree/B_Traversal/DFS -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex '.*/[A-Z]+_.*' | sort -r)
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            rel="${dir#src/main/java/}"
            pkg="${rel//\//.}"
            tmp="${file}.tmp"
            sed -E "1s/^package .+;/package ${pkg};/" "$file" > "$tmp"
            if ! cmp -s "$file" "$tmp"; then
              mv "$tmp" "$file"
              changed=$((changed+1))
            else
              rm "$tmp"
            fi
          done < <(find src/main/java/Tree/B_Traversal/BFS src/main/java/Tree/B_Traversal/DFS -name 'Solution.java' -type f)
          echo "Changed $changed items."
          if (( changed == 0 )); then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use AA-based Tree package serialization'
          git push